[package]
name = "kejtu-next-development"
version = "0.0.1"
description = "Kejtu Next isolated native development pipeline"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kejtu_next_development_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "~2.11", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
# Installed builds only: a second launch shows the open window. 2.4.0 is the
# newest release that supports the pinned Tauri 2.11.
tauri-plugin-single-instance = "=2.4.0"
# Already in the tree through tao; used to present the window with a fresh X11 time.
gdkx11 = "0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_WindowsProgramming"] }
